name: Bug report
description: Report a reproducible problem with fictional or redacted data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach raw logs, GPS tracks, serials, signatures, passwords, or API keys. Security issues belong in private reports."
  - type: input
    id: version
    attributes:
      label: Hikō version or image digest
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, and deployment method
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior. Use a fictional example where possible.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Redacted errors or screenshots
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal flight data and secrets from this report.
          required: true
