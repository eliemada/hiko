services:
  hiko:
    build: .
    image: ${HIKO_IMAGE:-ghcr.io/eliemada/hiko:0.1.0-beta.2}
    restart: unless-stopped
    ports:
      - "${HIKO_BIND:-127.0.0.1}:${HIKO_PORT:-3000}:3000"
    env_file: ${HIKO_ENV_FILE:-.env}
    environment:
      DATABASE_URL: file:/data/hiko.db
      DATA_DIR: /data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - hiko-data:/data

volumes:
  hiko-data:
